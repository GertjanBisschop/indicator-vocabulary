name: Deploy Vocabulary Browser

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/pages.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_terms: ${{ steps.detect-published.outputs.has_terms }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Detect published vocabulary terms
        id: detect-published
        run: |
          if [ -d published ] && find published -maxdepth 1 -name "*.trig" | grep -q .; then
            echo "has_terms=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_terms=false" >> "$GITHUB_OUTPUT"
            echo "No published vocabulary terms found; skipping browser build."
          fi

      - name: Extract assertions from published nanopubs
        if: steps.detect-published.outputs.has_terms == 'true'
        run: make assertions

      - name: Build site
        if: steps.detect-published.outputs.has_terms == 'true'
        run: |
          uvx --from git+https://github.com/eu-parc/serves-me-right@v0.0.1 serves-me-right-build \
            --data-dir build/assertions \
            --shapes site/ui-shapes.ttl \
            --out-dir dist

      - uses: actions/configure-pages@v6
        if: steps.detect-published.outputs.has_terms == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.detect-published.outputs.has_terms == 'true'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.has_terms == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: "github-pages"
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
